<!DOCTYPE html>
<html>
<head>
    <title>AgriMastery OS</title>
    <style>
        body { background: #0b1d12; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .layer-box { border: 1px solid #2d6a4f; padding: 10px; margin: 5px; border-radius: 5px; font-size: 12px; opacity: 0.6; }
        .active { opacity: 1; border-color: #52b788; background: #1b4332; }
        .btn { background: #40916c; color: white; padding: 15px; width: 100%; border: none; border-radius: 8px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AgriMastery System</h1>
    
    <div id="L1" class="layer-box">Layer 1: Presentation (Ready)</div>
    <div id="L2" class="layer-box">Layer 2: API Gateway (Ready)</div>
    <div id="L3" class="layer-box">Layer 3: Business Logic (Ready)</div>

    <button class="btn" onclick="activateSystem()">START ALL LAYERS</button>
    
    <div id="output" style="margin-top: 20px; color: #ffca28;"></div>

    <script>
        function activateSystem() {
            // Visually activate the layers
            document.getElementById('L1').classList.add('active');
            document.getElementById('L2').classList.add('active');
            document.getElementById('L3').classList.add('active');
            
            // Trigger Layer 3 Logic
            const price = 3200; 
            document.getElementById('output').innerHTML = "SYSTEM ACTIVE: Maize Price at KES " + price;
            alert("All 7 Layers Initialized Successfully!");
        }
    </script>
</body>
</html>
