<!DOCTYPE html>
<html>
<head>
    <title>AgriMastery | Executive Command Center</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; }
        .sidebar { width: 250px; background: #1B4332; height: 100vh; position: fixed; padding: 20px; }
        .main-content { margin-left: 290px; padding: 40px; }
        .stats-container { display: flex; gap: 20px; }
        .stat-card { background: #1e1e1e; padding: 20px; border-radius: 10px; border-top: 4px solid #D4AF37; flex: 1; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #D4AF37; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>AgriMastery</h2>
        <hr>
        <p>Dashboard</p>
        <p>User Management</p>
        <p>Global Catalog</p>
        <p>Academy Oversight</p>
    </div>
    <div class="main-content">
        <h1>Executive Overview</h1>
        <div class="stats-container">
            <div class="stat-card">
                <p>Total Revenue</p>
                <div class="stat-value">.2M</div>
            </div>
            <div class="stat-card">
                <p>Certified Farmers</p>
                <div class="stat-value">8,429</div>
            </div>
            <div class="stat-card">
                <p>Global SKUs</p>
                <div class="stat-value">124,000+</div>
            </div>
        </div>
    </div>
</body>
</html>
