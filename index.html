<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMastery | Modular Stack</title>
    <style>
        :root { --primary: #2d6a4f; --accent: #ffca28; --bg: #0b1d12; --card: #1b4332; }
        body { background: var(--bg); color: #e8f5e9; font-family: sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 10px; border-bottom: 2px solid var(--primary); }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 5px solid var(--primary); }
        .btn { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--primary); background: #081c15; color: white; box-sizing: border-box; }
        .result-card { background: #081c15; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--accent); }
    </style>
</head>
<body onload="agriEngine.init()">
    <div class="header">
        <h1 style="color: var(--accent); margin: 0;">AGRIMASTERY</h1>
        <small>Modular Architecture: /components/</small>
    </div>

    <div id="app-viewport">Initializing System...</div>

    <script>
        const agriEngine = {
            inventory: JSON.parse(localStorage.getItem('agri_inv')) || [{name: "Maize", price: "KES 3,200"}],

            init: async function() {
                const session = sessionStorage.getItem('admin_session');
                await this.loadComponent(session === "robin_active" ? 'admin' : 'public');
            },

            // SEARCHING IN THE COMMON FOLDER
            loadComponent: async function(name) {
                try {
                    const response = await fetch('components/' + name + '.html');
                    const html = await response.text();
                    document.getElementById('app-viewport').innerHTML = html;
                    
                    if(name === 'admin') this.renderAdminInv();
                } catch (err) {
                    console.error("Layer fetch error:", err);
                }
            },

            login: function() {
                const u = document.getElementById('adminUser').value.toLowerCase().trim();
                const p = document.getElementById('adminPass').value.trim();
                if(u === "robin" && p === "1234") {
                    sessionStorage.setItem('admin_session', 'robin_active');
                    this.loadComponent('admin');
                } else { alert("Rejected."); }
            },

            search: function() {
                const query = document.getElementById('searchInput').value.toLowerCase();
                const results = document.getElementById('searchResults');
                results.innerHTML = "";
                if(query.length < 1) return;

                this.inventory.filter(i => i.name.toLowerCase().includes(query)).forEach(item => {
                    results.innerHTML += \<div class="result-card"><strong>\</strong>: \</div>\;
                });
            },

            addProduct: function() {
                const name = document.getElementById('itemName').value;
                const price = document.getElementById('itemPrice').value;
                if(!name || !price) return;
                this.inventory.push({name, price});
                localStorage.setItem('agri_inv', JSON.stringify(this.inventory));
                this.renderAdminInv();
            },

            renderAdminInv: function() {
                const list = document.getElementById('adminInventory');
                if(!list) return;
                list.innerHTML = "";
                this.inventory.forEach(item => {
                    list.innerHTML += \<div style="padding:8px; border-bottom:1px solid #2d6a4f;">\ - \</div>\;
                });
            },

            logout: function() {
                sessionStorage.removeItem('admin_session');
                this.loadComponent('public');
            }
        };
    </script>
</body>
</html>
