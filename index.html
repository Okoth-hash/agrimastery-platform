<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriMastery V64 - Comms Integrity</title>
    <style>
        :root { --orange: #f68b1e; --green: #065f46; --dark: #0f172a; --slate: #1e293b; --cyan: #22d3ee; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f1f5f9; color: var(--slate); }
        /* PERSISTENT BROADCAST */
        #alert-bar { background: var(--orange); color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 13px; display: none; position: sticky; top: 0; z-index: 2000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        /* NAV */
        #nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #94a3af; cursor: pointer; text-transform: uppercase; }
        .nav-active { color: var(--orange); border-top: 4px solid var(--orange); }
        /* VIEWPORT */
        #viewport { min-height: 100vh; padding-bottom: 100px; }
        .container { padding: 15px; }
        /* CARDS */
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); margin-bottom: 15px; }
        .btn { border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 11px; }
        .btn-green { background: var(--green); color: white; }
        .btn-orange { background: var(--orange); color: white; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        /* MESSAGING UI */
        .msg-bubble { background: #f0f9ff; padding: 12px; border-radius: 10px; margin-bottom: 12px; border-left: 5px solid var(--cyan); position: relative; }
        .reply-tag { position: absolute; top: -10px; right: 10px; background: var(--orange); color: white; padding: 2px 8px; border-radius: 10px; font-size: 9px; }
        /* ADMIN SPECIFIC */
        .admin-view { background: var(--dark); color: white; min-height: 100vh; padding: 20px; font-family: 'Courier New', monospace; }
        .terminal { background: black; color: #4ade80; padding: 12px; border-radius: 8px; height: 120px; overflow-y: auto; font-size: 10px; border: 1px solid #334155; margin-top: 15px; }
        .inbox-scroll { max-height: 200px; overflow-y: auto; background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div id="alert-bar"></div>
    <div id="viewport"></div>
    <div id="nav"></div>
    <script>
    const storageKey = 'AgriIntegrity_v64';
    const db = JSON.parse(localStorage.getItem(storageKey)) || {
        wallet: 900000,
        users: [], 
        currentUser: null,
        logs: ["System V64: Comms Integrity Locked"],
        adminLocked: true,
        broadcast: "",
        adminInbox: [],
        userMsgs: {}
    };
    function save() { localStorage.setItem(storageKey, JSON.stringify(db)); }
    function log(m) { db.logs.push(`[${new Date().toLocaleTimeString()}] ${m}`); save(); }
    function render() {
        const v = document.getElementById('viewport');
        const n = document.getElementById('nav');
        const ab = document.getElementById('alert-bar');
        const tab = window.activeTab || 'admin';
        if (db.broadcast) { ab.innerHTML = "?? " + db.broadcast + " <span onclick='clearBC()' style='float:right; cursor:pointer;'>?</span>"; ab.style.display = "block"; } 
        else { ab.style.display = "none"; }
        if (tab === 'admin') {
            if (db.adminLocked) {
                v.innerHTML = `<div class="admin-view" style="display:flex; justify-content:center; align-items:center; flex-direction:column;">
                    <h2 style="color:var(--cyan);">ENCRYPTED COMMAND</h2>
                    <input id="pin" type="password" class="input-field" style="width:140px; text-align:center;">
                    <button onclick="if(document.getElementById('pin').value==='1234'){db.adminLocked=false; render()}" class="btn btn-orange" style="width:140px; margin-top:10px;">UNLOCK</button>
                </div>`;
            } else {
                v.innerHTML = `<div class="admin-view">
                    <div style="display:flex; justify-content:space-between;"><span>CORE_CMD_V64</span><button onclick="db.adminLocked=true; render()" style="color:red; background:none; border:none;">[LOCK]</button></div>
                    <div class="card" style="background:#1e293b; color:white; border:1px solid #334155; margin-top:20px;">
                        <p style="font-size:10px; color:var(--orange);">STUDENT REPLIES FEED</p>
                        <div class="inbox-scroll">
                            ${db.adminInbox.length === 0 ? '<p style="font-size:10px; color:#555;">No incoming replies.</p>' : 
                            db.adminInbox.map(m => `<div style="border-bottom:1px solid #334155; padding:5px 0;"><b>${m.from}:</b> ${m.msg} <small style="color:#4ade80;">(${m.time})</small></div>`).reverse().join('')}
                        </div>
                        <button onclick="db.adminInbox=[]; save(); render();" style="color:#f87171; background:none; border:none; font-size:9px; margin-top:10px;">[CLEAR FEED]</button>
                    </div>
                    <div class="card" style="background:#1e293b; color:white; border:1px solid #334155;">
                        <p style="font-size:10px; color:var(--cyan);">DIRECT MESSAGE ENGINE</p>
                        <select id="target" class="input-field" style="background:black; color:white; border-color:#444;">
                            <option value="">-- SELECT STUDENT --</option>
                            ${db.users.map(u => `<option value="${u}">${u}</option>`).join('')}
                        </select>
                        <input id="dm" class="input-field" style="background:black; color:white; border-color:#444;" placeholder="Message text...">
                        <button onclick="sendMsg()" class="btn btn-green" style="background:var(--cyan); color:var(--dark);">PUSH MESSAGE</button>
                        <button onclick="db.broadcast=document.getElementById('dm').value; log('GLOBAL BROADCAST'); render();" class="btn btn-orange" style="margin-top:5px;">BROADCAST TO ALL</button>
                    </div>
                    <div class="terminal">${db.logs.map(l => `> ${l}`).reverse().join('<br>')}</div>
                </div>`;
            }
        } else if (tab === 'academy') {
            if (!db.currentUser) {
                v.innerHTML = `<div class="container"><div class="card"><h3>Student Login</h3><input id="u" class="input-field"><button onclick="login()" class="btn btn-green">ENTER</button></div></div>`;
            } else {
                const msgs = db.userMsgs[db.currentUser] || [];
                v.innerHTML = `<div class="container">
                    <div style="display:flex; justify-content:space-between; align-items:center;"><h3>Portal: ${db.currentUser}</h3><button onclick="db.currentUser=null; render()" style="color:red; background:none; border:none;">LOGOUT</button></div>
                    <div class="card">
                        <h4>?? Inbox</h4>
                        ${msgs.map((m, i) => `
                            <div class="msg-bubble">
                                <b>Admin:</b> ${m}
                                <button onclick="toggleReply(${i})" style="float:right; border:none; background:none; color:var(--orange); font-size:10px; font-weight:bold;">REPLY</button>
                                <div id="r-${i}" style="display:none; margin-top:10px; border-top:1px solid #ddd; padding-top:10px;">
                                    <input id="ri-${i}" class="input-field" placeholder="Type reply...">
                                    <button onclick="sendReply(${i})" class="btn btn-green">SEND TO ADMIN</button>
                                </div>
                            </div>`).reverse().join('')}
                    </div>
                </div>`;
            }
        } else if (tab === 'market') {
            v.innerHTML = `<div class="container" style="text-align:center;"><img src="https://images.unsplash.com/photo-1592982537447-7440770cbfc9?w=300" style="width:100%; border-radius:15px;"><p>Market Online. Wallet: KSh ${db.wallet.toLocaleString()}</p></div>`;
        }
        n.innerHTML = `
            <div onclick="window.activeTab='admin'; render()" class="nav-item ${tab==='admin'?'nav-active':''}">Dashboard</div>
            <div onclick="window.activeTab='academy'; render()" class="nav-item ${tab==='academy'?'nav-active':''}">Academy</div>
            <div onclick="window.activeTab='market'; render()" class="nav-item ${tab==='market'?'nav-active':''}">Market</div>
        `;
    }
    window.login = function() {
        const u = document.getElementById('u').value;
        if(u) { db.currentUser = u; if(!db.users.includes(u)) { db.users.push(u); log('REG: ' + u); } save(); render(); }
    };
    window.sendMsg = function() {
        const t = document.getElementById('target').value;
        const m = document.getElementById('dm').value;
        if(t && m) { if(!db.userMsgs[t]) db.userMsgs[t] = []; db.userMsgs[t].push(m); log('DM to ' + t); save(); render(); alert('Sent!'); }
    };
    window.toggleReply = function(i) { const el = document.getElementById('r-' + i); el.style.display = el.style.display === 'none' ? 'block' : 'none'; };
    window.sendReply = function(i) {
        const r = document.getElementById('ri-' + i).value;
        if(r) { db.adminInbox.push({from: db.currentUser, msg: r, time: new Date().toLocaleTimeString()}); log('REPLY: ' + db.currentUser); save(); render(); alert('Sent!'); }
    };
    window.clearBC = function() { db.broadcast = ""; save(); render(); };
    render();
    </script>
</body>
</html>
