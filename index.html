<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMastery | Global Hub</title>
    <style>
        :root { --primary: #2d6a4f; --accent: #ffca28; --bg: #0b1d12; --card: #1b4332; }
        body { background: var(--bg); color: #e8f5e9; font-family: sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 10px; border-bottom: 2px solid var(--primary); }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 5px solid var(--primary); }
        .btn { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--primary); background: #081c15; color: white; box-sizing: border-box; }
        .result-card { background: #081c15; padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--accent); animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body onload="agriEngine.init()">

    <div class="header">
        <h1 style="color: var(--accent); margin: 0;">AGRIMASTERY</h1>
        <small id="sub-tag">Public Marketplace: Kenya Hub</small>
    </div>

    <div id="publicUI">
        <div class="card">
            <h3> Search Marketplace</h3>
            <input type="text" id="searchInput" placeholder="Search Maize, Beans, Wheat..." onkeyup="agriEngine.search()">
            <div id="searchResults"></div>
        </div>
        <button class="btn" style="background:none; color:var(--accent); font-size:12px;" onclick="agriEngine.showLogin()">Admin Login</button>
    </div>

    <div id="loginUI" style="display:none;" class="card">
        <h3>Admin Authorization</h3>
        <input type="text" id="adminUser" placeholder="Username">
        <input type="password" id="adminPass" placeholder="Password">
        <button class="btn" onclick="agriEngine.login()">Login</button>
        <button class="btn" style="background:#444;" onclick="agriEngine.hideLogin()">Back</button>
    </div>

    <div id="adminUI" style="display:none;">
        <div class="card">
            <h3 style="color: var(--accent);"> Marketplace Manager</h3>
            <input type="text" id="itemName" placeholder="Crop Name">
            <input type="text" id="itemPrice" placeholder="Price (e.g. KES 5,000)">
            <button class="btn" onclick="agriEngine.addProduct()">Add to Live Market</button>
        </div>
        <div class="card">
            <h3>Current Inventory</h3>
            <div id="adminInventory"></div>
            <button class="btn" style="background:#8b0000;" onclick="agriEngine.logout()">Logout</button>
        </div>
    </div>

    <script>
        const agriEngine = {
            inventory: JSON.parse(localStorage.getItem('agri_inv')) || [
                {name: "Maize", price: "KES 3,200"},
                {name: "Beans", price: "KES 8,500"}
            ],

            init: function() {
                if (sessionStorage.getItem('admin_session') === "robin_active") {
                    this.showAdmin();
                }
            },

            search: function() {
                const query = document.getElementById('searchInput').value.toLowerCase();
                const results = document.getElementById('searchResults');
                results.innerHTML = "";
                
                if(query.length < 1) return;

                const filtered = this.inventory.filter(item => item.name.toLowerCase().includes(query));
                
                filtered.forEach(item => {
                    results.innerHTML += \
                        <div class="result-card">
                            <strong style="color:var(--accent)">\</strong><br>
                            <span>Current Market Price: \</span>
                        </div>\;
                });
            },

            addProduct: function() {
                const name = document.getElementById('itemName').value;
                const price = document.getElementById('itemPrice').value;
                if(!name || !price) return;
                this.inventory.push({name, price});
                localStorage.setItem('agri_inv', JSON.stringify(this.inventory));
                this.renderAdminInv();
                alert(name + " added to live market!");
            },

            renderAdminInv: function() {
                const list = document.getElementById('adminInventory');
                list.innerHTML = "";
                this.inventory.forEach((item, index) => {
                    list.innerHTML += \<div style="display:flex; justify-content:space-between; padding:5px; border-bottom:1px solid #2d6a4f;">
                        <span>\</span> <span>\</span>
                    </div>\;
                });
            },

            showLogin: () => { document.getElementById('publicUI').style.display = 'none'; document.getElementById('loginUI').style.display = 'block'; },
            hideLogin: () => { document.getElementById('publicUI').style.display = 'block'; document.getElementById('loginUI').style.display = 'none'; },
            
            login: function() {
                if(document.getElementById('adminUser').value.toLowerCase() === "robin" && document.getElementById('adminPass').value === "1234") {
                    sessionStorage.setItem('admin_session', 'robin_active');
                    this.showAdmin();
                } else { alert("Denied"); }
            },

            showAdmin: function() {
                document.getElementById('publicUI').style.display = 'none';
                document.getElementById('loginUI').style.display = 'none';
                document.getElementById('adminUI').style.display = 'block';
                document.getElementById('sub-tag').innerText = "Admin Hub: Active";
                this.renderAdminInv();
            },

            logout: function() { sessionStorage.removeItem('admin_session'); location.reload(); }
        };
    </script>
</body>
</html>
