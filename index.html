<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMastery | Fully Active Portal</title>
    <style>
        :root { --primary: #2d6a4f; --accent: #ffca28; --bg: #0b1d12; }
        body { background: var(--bg); color: #e8f5e9; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        .card { background: #1b4332; border-radius: 12px; padding: 20px; margin-bottom: 15px; border-left: 5px solid var(--primary); transition: 0.3s; }
        .card.active { border-left-color: var(--accent); transform: scale(1.02); }
        .badge { background: var(--accent); color: #000; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--primary); background: #081c15; color: white; margin: 10px 0; box-sizing: border-box;}
        .btn { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
        #results { margin-top: 15px; }
    </style>
</head>
<body>
    <header style="text-align: center; padding: 20px 0;">
        <h1 style="color: var(--accent); margin: 0;">AGRIMASTERY</h1>
        <small>Enterprise 7-Layer System Active</small>
    </header>

    <div class="card" id="search-card">
        <h3> Active Marketplace Search</h3>
        <input type="text" id="cropInput" placeholder="Enter crop (e.g. Maize, Beans)">
        <button class="btn" onclick="app.search()">Search Ranking Engine</button>
        <div id="results"></div>
    </div>

    <div class="card">
        <h3> Real-Time Market Intelligence</h3>
        <p id="price-display">Select a crop to view current KES price...</p>
    </div>

    <script>
        // CORE ACTIVE LOGIC (Linking Layer 1 to Layer 3)
        const app = {
            data: {
                "maize": { price: "3,200", unit: "90kg Bag", farmer: "Omondi", status: "Verified Master" },
                "beans": { price: "8,500", unit: "90kg Bag", farmer: "Njeri", status: "Gold Member" }
            },
            search: function() {
                const query = document.getElementById('cropInput').value.toLowerCase();
                const resultsDiv = document.getElementById('results');
                const priceDiv = document.getElementById('price-display');
                
                if (this.data[query]) {
                    const item = this.data[query];
                    document.getElementById('search-card').classList.add('active');
                    
                    resultsDiv.innerHTML = \
                        <div style="background: #2d6a4f; padding: 10px; border-radius: 8px; margin-top: 10px;">
                            <strong>Top Match:</strong> \ <span class="badge">\</span><br>
                            <small>Stock available in Eldoret</small>
                        </div>\;
                    
                    priceDiv.innerHTML = \Current \ price: <strong>KES \</strong> per \\;
                } else {
                    resultsDiv.innerHTML = "<p style='color: #ff5252;'>No active listings found for that crop.</p>";
                }
            }
        };
    </script>
</body>
</html>
