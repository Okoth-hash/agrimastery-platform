<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriMastery V62 - Two-Way Sync</title>
    <style>
        :root { --orange: #f68b1e; --green: #065f46; --dark: #0f172a; --slate: #1e293b; --cyan: #22d3ee; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #f1f5f9; color: var(--slate); }
        /* ALERTS */
        #alert-bar { background: var(--orange); color: white; padding: 10px; text-align: center; font-weight: bold; font-size: 12px; display: none; position: sticky; top: 0; z-index: 2000; }
        /* NAV */
        #nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #94a3af; cursor: pointer; text-transform: uppercase; }
        .nav-active { color: var(--orange); border-top: 4px solid var(--orange); }
        /* VIEWPORT */
        #viewport { min-height: 100vh; padding-bottom: 100px; }
        .container { padding: 15px; }
        /* CARDS & UI */
        .card { background: white; padding: 18px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); margin-bottom: 15px; }
        .btn { border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase; }
        .btn-green { background: var(--green); color: white; }
        .btn-cyan { background: var(--cyan); color: var(--dark); }
        .input-field { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        /* MESSAGING */
        .msg-bubble { background: #f0f9ff; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--cyan); position: relative; }
        .reply-area { margin-top: 8px; display: none; }
        /* ADMIN SPECIFIC */
        .admin-view { background: var(--dark); color: white; min-height: 100vh; padding: 20px; font-family: monospace; }
        .terminal { background: black; color: #4ade80; padding: 10px; height: 120px; overflow-y: auto; font-size: 10px; border-radius: 5px; margin-top: 10px; }
        .inbox-item { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div id="alert-bar"></div>
    <div id="viewport"></div>
    <div id="nav"></div>
    <script>
    const storageKey = 'AgriTwoWay_v62';
    const db = JSON.parse(localStorage.getItem(storageKey)) || {
        wallet: 850000,
        users: [], 
        currentUser: null,
        logs: ["System V62: Two-Way Comms Active"],
        adminLocked: true,
        broadcast: "",
        adminInbox: [], // [{from, msg, time}]
        userMsgs: {} // {username: [msgs]}
    };
    function save() { localStorage.setItem(storageKey, JSON.stringify(db)); }
    function log(m) { db.logs.push(`[${new Date().toLocaleTimeString()}] ${m}`); save(); }
    function render() {
        const v = document.getElementById('viewport');
        const n = document.getElementById('nav');
        const ab = document.getElementById('alert-bar');
        const tab = window.activeTab || 'admin';
        if (db.broadcast) { ab.innerText = "?? " + db.broadcast; ab.style.display = "block"; } 
        else { ab.style.display = "none"; }
        if (tab === 'admin') {
            if (db.adminLocked) {
                v.innerHTML = `<div class="admin-view" style="display:flex; justify-content:center; align-items:center; flex-direction:column;">
                    <h2 style="color:var(--cyan);">SECURE LOGIN</h2>
                    <input id="pin" type="password" class="input-field" style="width:120px; text-align:center;">
                    <button onclick="if(document.getElementById('pin').value==='1234'){db.adminLocked=false; render()}" class="btn btn-cyan" style="width:120px; margin-top:10px;">UNLOCK</button>
                </div>`;
            } else {
                v.innerHTML = `<div class="admin-view">
                    <div style="display:flex; justify-content:space-between;"><span>ADMIN COMMAND</span><button onclick="db.adminLocked=true; render()" style="color:red; background:none; border:none;">[LOCK]</button></div>
                    <div class="card" style="background:#1e293b; color:white; margin-top:15px; border:1px solid #334155;">
                        <p style="font-size:10px; color:var(--cyan);">INCOMING STUDENT REPLIES</p>
                        ${db.adminInbox.length === 0 ? '<p style="font-size:11px; color:#666;">No new messages.</p>' : 
                        db.adminInbox.map((m, i) => `<div class="inbox-item"><b>${m.from}:</b> ${m.msg} <br><small style="color:#555;">${m.time}</small></div>`).join('')}
                        <button onclick="db.adminInbox=[]; save(); render();" style="font-size:9px; background:none; border:none; color:#f87171; cursor:pointer;">CLEAR INBOX</button>
                    </div>
                    <div class="card" style="background:#1e293b; color:white; border:1px solid #334155;">
                        <p style="font-size:10px;">SEND MESSAGE TO STUDENT</p>
                        <select id="target" class="input-field" style="background:#000; color:white;">
                            <option value="">-- SELECT --</option>
                            ${db.users.map(u => `<option value="${u}">${u}</option>`).join('')}
                        </select>
                        <input id="dm" class="input-field" style="background:#000; color:white;" placeholder="Message...">
                        <button onclick="sendMsg()" class="btn btn-cyan">SEND PRIVATE</button>
                    </div>
                    <div class="terminal">${db.logs.map(l => `> ${l}`).reverse().join('<br>')}</div>
                </div>`;
            }
        } else if (tab === 'academy') {
            if (!db.currentUser) {
                v.innerHTML = `<div class="container"><div class="card"><h3>Student Login</h3><input id="u" class="input-field"><button onclick="login()" class="btn btn-green" style="width:100%;">LOGIN</button></div></div>`;
            } else {
                const msgs = db.userMsgs[db.currentUser] || [];
                v.innerHTML = `<div class="container">
                    <h3>Portal: ${db.currentUser}</h3>
                    <div class="card">
                        <h4>?? Inbox</h4>
                        ${msgs.map((m, i) => `
                            <div class="msg-bubble">
                                <b>Admin:</b> ${m}
                                <button onclick="document.getElementById('r-${i}').style.display='block'" style="float:right; border:none; background:none; color:var(--orange); font-size:10px; font-weight:bold;">REPLY</button>
                                <div id="r-${i}" class="reply-area">
                                    <input id="ri-${i}" class="input-field" placeholder="Type reply...">
                                    <button onclick="sendReply(${i})" class="btn btn-green" style="width:100%;">SEND TO ADMIN</button>
                                </div>
                            </div>`).reverse().join('')}
                    </div>
                    <button onclick="db.currentUser=null; render()" style="color:red; background:none; border:none;">LOGOUT</button>
                </div>`;
            }
        } else if (tab === 'market') {
            v.innerHTML = `<div class="container" style="text-align:center;"><h2>Marketplace</h2><p>Balance: KSh ${db.wallet.toLocaleString()}</p></div>`;
        }
        n.innerHTML = `
            <div onclick="window.activeTab='admin'; render()" class="nav-item ${tab==='admin'?'nav-active':''}">Dashboard</div>
            <div onclick="window.activeTab='academy'; render()" class="nav-item ${tab==='academy'?'nav-active':''}">Academy</div>
            <div onclick="window.activeTab='market'; render()" class="nav-item ${tab==='market'?'nav-active':''}">Market</div>
        `;
    }
    window.login = function() {
        const u = document.getElementById('u').value;
        if(u) {
            db.currentUser = u;
            if(!db.users.includes(u)) { db.users.push(u); log('USER REGISTERED: ' + u); }
            save(); render();
        }
    };
    window.sendMsg = function() {
        const t = document.getElementById('target').value;
        const m = document.getElementById('dm').value;
        if(t && m) {
            if(!db.userMsgs[t]) db.userMsgs[t] = [];
            db.userMsgs[t].push(m);
            log('SENT DM TO ' + t);
            save(); render(); alert('Sent!');
        }
    };
    window.sendReply = function(idx) {
        const r = document.getElementById('ri-' + idx).value;
        if(r) {
            db.adminInbox.push({from: db.currentUser, msg: r, time: new Date().toLocaleTimeString()});
            log('REPLY FROM ' + db.currentUser);
            save(); render(); alert('Reply Sent to Admin!');
        }
    };
    render();
    </script>
</body>
</html>
