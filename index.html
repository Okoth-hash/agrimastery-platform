<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriMastery Titan v53</title>
    <style>
        :root { --orange: #f68b1e; --green: #065f46; --dark: #0f172a; --bg: #f1f5f9; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: #1e293b; overflow-x: hidden; }
        /* GLOBAL HEADER */
        .header { background: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .logo-box { display: flex; align-items: center; gap: 8px; }
        .logo-box img { width: 32px; height: 32px; }
        .wallet-chip { background: var(--green); color: white; padding: 6px 12px; border-radius: 20px; font-weight: 800; font-size: 13px; letter-spacing: 0.5px; }
        /* VIEWPORT & NAV */
        #viewport { min-height: 100vh; padding-bottom: 90px; }
        #nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #94a3af; cursor: pointer; text-transform: uppercase; }
        .tab-active { color: var(--orange); border-top: 4px solid var(--orange); }
        /* MARKET GRID */
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 110px; object-fit: cover; }
        .card-body { padding: 10px; flex-grow: 1; }
        .card-name { font-size: 11px; height: 32px; overflow: hidden; color: #475569; font-weight: 600; }
        .card-price { color: var(--orange); font-weight: 800; margin-top: 5px; }
        .buy-btn { width: 100%; background: var(--orange); color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        /* ADMIN SECURE */
        .admin-view { background: var(--dark); color: white; min-height: 100vh; padding: 25px; font-family: monospace; }
        .admin-card { background: #1e293b; padding: 20px; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid #38bdf8; }
        .terminal-log { background: #000; padding: 15px; border-radius: 10px; height: 150px; overflow-y: auto; font-size: 11px; color: #4ade80; border: 1px solid #334155; }
        .pin-field { width: 100%; padding: 15px; background: #1e293b; border: 2px solid #334155; color: white; text-align: center; font-size: 28px; border-radius: 10px; margin-bottom: 20px; }
        /* ACADEMY */
        .academy-form { background: white; padding: 25px; border-radius: 20px; margin: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .enroll-btn { background: var(--green); color: white; border: none; padding: 8px 15px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="nav"></div>
    <script>
    // 1. SYSTEM DATA
    const storageKey = 'agriTitan_v53';
    const db = JSON.parse(localStorage.getItem(storageKey)) || {
        users: [], 
        wallet: 200000, 
        logs: [], 
        currentUser: null, 
        adminLocked: true
    };
    function save() { localStorage.setItem(storageKey, JSON.stringify(db)); }
    // 2. GENERATE 110 PRODUCTS
    const products = [];
    for(let i=1; i<=110; i++) {
        products.push({ id: i, n: "Agri-Titan SKU-" + (2000+i), p: 1800 + (i*12), img: "https://images.unsplash.com/photo-1592982537447-7440770cbfc9?w=300" });
    }
    // 3. RENDER ENGINE
    function render() {
        const v = document.getElementById('viewport');
        const n = document.getElementById('nav');
        const tab = window.activeTab || 'market';
        if (tab === 'market') {
            v.innerHTML = `
                <div class="header">
                    <div class="logo-box"><img src="https://cdn-icons-png.flaticon.com/128/2972/2972215.png"><img src="https://cdn-icons-png.flaticon.com/128/143/143438.png"></div>
                    <div class="wallet-chip">KSh ${db.wallet.toLocaleString()}</div>
                    <div style="font-size:22px;">??</div>
                </div>
                <div class="market-grid">
                    ${products.slice(0,25).map(p => `
                        <div class="card">
                            <img src="${p.img}">
                            <div class="card-body"><div class="card-name">${p.n}</div><div class="card-price">KSh ${p.p.toLocaleString()}</div></div>
                            <button class="buy-btn" onclick="buyItem(${p.p}, '${p.n}')">ADD TO CART</button>
                        </div>`).join('')}
                </div>`;
        } else if (tab === 'academy') {
            if (!db.currentUser) {
                v.innerHTML = `<div style="padding:20px;"><div class="academy-form">
                    <h2 style="color:var(--green); text-align:center;">Student Portal</h2>
                    <input id="userIn" type="text" placeholder="Full Name" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #ddd;">
                    <input id="passIn" type="password" placeholder="PIN" style="width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:1px solid #ddd;">
                    <button class="buy-btn" onclick="registerUser()" style="background:var(--green); border-radius:10px;">CREATE ACCOUNT</button>
                </div></div>`;
            } else {
                const user = db.users.find(u => u.name === db.currentUser);
                v.innerHTML = `<div style="padding:20px;">
                    <h3>Welcome back, ${user.name}!</h3>
                    <div class="admin-card" style="background:white; color:black; border-left-color:var(--orange);">
                        <p style="margin:0; font-size:12px;">Active Course Units: ${user.courses.length}</p>
                    </div>
                    <h4>Enrolled Units</h4>
                    ${user.courses.map(c => `<div style="background:white; padding:15px; border-radius:10px; margin-bottom:8px; border-bottom:2px solid #eee;"><b>${c}</b></div>`).join('')}
                    <button onclick="enroll('Advanced Fish Farming')" class="enroll-btn" style="width:100%; padding:15px; margin-top:10px;">ENROLL IN NEW UNIT</button>
                    <button onclick="db.currentUser=null; render();" style="margin-top:30px; display:block; color:red; border:none; background:none; font-weight:bold;">LOGOUT</button>
                </div>`;
            }
        } else if (tab === 'admin') {
            if (db.adminLocked) {
                v.innerHTML = `<div class="admin-view" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                    <h2 style="color:#38bdf8; letter-spacing:3px;">SECURE ADMIN</h2>
                    <input type="password" id="admPin" class="pin-field" placeholder="****">
                    <button class="buy-btn" onclick="if(document.getElementById('admPin').value==='1234'){db.adminLocked=false; render();}else{alert('WRONG PIN')}" style="border-radius:10px; width:200px;">UNLOCK</button>
                </div>`;
            } else {
                v.innerHTML = `<div class="admin-view">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:10px; margin-bottom:20px;">
                        <span style="color:#38bdf8; font-weight:bold;">SYSTEM MASTER</span>
                        <button onclick="db.adminLocked=true; render();" style="color:#ef4444; border:none; background:none; font-size:11px;">[LOCK EXIT]</button>
                    </div>
                    <div class="admin-card">
                        <p style="font-size:10px; color:#94a3b8;">LIQUIDITY</p>
                        <h1 style="color:#4ade80; margin:5px 0;">KSh ${db.wallet.toLocaleString()}</h1>
                        <button onclick="db.wallet+=100000; db.logs.push('ADMIN: INJECTED 100K'); save(); render();" style="width:100%; padding:10px; background:#38bdf8; border:none; border-radius:5px; font-weight:bold; margin-bottom:5px;">INJECT 100K</button>
                        <button onclick="db.wallet-=20000; db.logs.push('ADMIN: WITHDREW 20K'); save(); render();" style="width:100%; padding:10px; background:#f87171; border:none; border-radius:5px; font-weight:bold;">EXTRACT 20K</button>
                    </div>
                    <p style="color:#38bdf8; font-size:11px;">SYSTEM AUDIT LOG</p>
                    <div class="terminal-log">${db.logs.map(l => `> ${l}`).reverse().join('<br>')}</div>
                </div>`;
            }
        }
        n.innerHTML = `
            <div onclick="window.activeTab='market'; render();" class="nav-tab ${tab==='market'?'tab-active':''}">Market</div>
            <div onclick="window.activeTab='academy'; render();" class="nav-tab ${tab==='academy'?'tab-active':''}">Academy</div>
            <div onclick="window.activeTab='admin'; render();" class="nav-tab ${tab==='admin'?'tab-active':''}">Admin</div>
        `;
    }
    // 4. LOGIC FUNCTIONS
    window.registerUser = function() {
        const n = document.getElementById('userIn').value;
        const p = document.getElementById('passIn').value;
        if(n && p) {
            db.users.push({name: n, pin: p, courses: ['General Agribusiness']});
            db.currentUser = n; db.logs.push('NEW STUDENT: ' + n);
            save(); render();
        }
    };
    window.enroll = function(course) {
        const u = db.users.find(u => u.name === db.currentUser);
        if(!u.courses.includes(course)) {
            u.courses.push(course); db.logs.push(u.name + ' ENROLLED: ' + course);
            save(); render();
        }
    };
    window.buyItem = function(p, n) {
        if(db.wallet >= p) {
            db.wallet -= p; db.logs.push('SOLD: ' + n + ' (-KSh ' + p + ')');
            save(); render(); alert('Item Added to Your Farm!');
        } else { alert('Insufficient System Funds'); }
    };
    render();
    </script>
</body>
</html>
