<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMastery Global | Verified Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1d12; color: #e8f5e9; margin: 0; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #2d6a4f; padding-bottom: 10px; margin-bottom: 20px; }
        .card { background: #1b4332; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid #40916c; }
        .badge { background: #ffca28; color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .btn { background: #40916c; color: white; padding: 12px; border: none; border-radius: 8px; width: 100%; margin-top: 10px; font-weight: bold; cursor: pointer; }
        .price-tag { color: #95d5b2; font-size: 1.2em; font-weight: bold; }
        #search-box { width: 90%; padding: 10px; border-radius: 5px; border: none; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AGRIMASTERY</h1>
        <p>Verified Farmer Network</p>
    </div>

    <div class="card">
        <h3> Search Marketplace</h3>
        <input type="text" id="search-box" placeholder="Search Maize, Beans...">
        <button class="btn" onclick="runSearch()">Search Ranking Engine</button>
        <div id="search-results"></div>
    </div>

    <div class="card">
        <h3> Market Intelligence</h3>
        <p>Maize (90kg Bag): <span class="price-tag">KES 3,200</span></p>
        <p>Trend: <span style="color: #52b788;"> High Demand</span></p>
        <button class="btn" onclick="alert('Analysis: Sell now to maximize profit.')">Get Expert Advice</button>
    </div>

    <script>
        function runSearch() {
            const results = document.getElementById('search-results');
            results.innerHTML = \
                <div style="margin-top:15px; border-top: 1px solid #2d6a4f; padding-top:10px;">
                    <strong>Omondi's Premium Maize</strong> <span class="badge">VERIFIED MASTER</span><br>
                    <small>Location: Kenya | Stock: 500 Bags</small>
                </div>
            \;
        }
    </script>
</body>
</html>
