<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriMastery Academy</title>
    <style>
        :root { --orange: #f68b1e; --green: #065f46; --dark: #0f172a; --bg: #f1f5f9; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: #1e293b; }
        .header { background: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .brand { display: flex; align-items: center; gap: 8px; }
        .brand img { width: 32px; height: 32px; }
        #viewport { min-height: 100vh; padding-bottom: 90px; }
        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 100; }
        .nav-item { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #94a3af; cursor: pointer; text-transform: uppercase; }
        .nav-active { color: var(--orange); border-top: 3px solid var(--orange); }
        /* ACADEMY STYLES */
        .auth-card { background: white; padding: 30px; border-radius: 20px; margin: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #64748b; font-weight: bold; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        .btn-primary { width: 100%; background: var(--green); color: white; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .course-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--orange); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div id="viewport"></div>
    <div id="nav"></div>
    <script>
    const storageKey = 'agriSystem_v50';
    const db = JSON.parse(localStorage.getItem(storageKey)) || {
        users: [], // Array of {username, password, courses: []}
        currentUser: null,
        wallet: 100000,
        history: []
    };
    function save() { localStorage.setItem(storageKey, JSON.stringify(db)); }
    const courses = [
        "Modern Greenhouse Farming",
        "Drip Irrigation Systems",
        "Sustainable Soil Management",
        "Agribusiness Marketing",
        "Fish Farming (Aquaculture)"
    ];
    function render() {
        const v = document.getElementById('viewport');
        const n = document.getElementById('nav');
        const activeTab = window.activeTab || 'academy';
        if (activeTab === 'academy') {
            if (!db.currentUser) {
                // REGISTRATION / LOGIN SCREEN
                v.innerHTML = `
                <div style="padding: 20px;">
                    <h2 style="text-align:center; color:var(--green);">Academy Portal</h2>
                    <div class="auth-card">
                        <h3>Join Academy</h3>
                        <div class="input-group"><label>Full Name</label><input id="regName" type="text" placeholder="Enter name"></div>
                        <div class="input-group"><label>Password</label><input id="regPass" type="password" placeholder="Create password"></div>
                        <button class="btn-primary" onclick="register()">REGISTER NOW</button>
                        <p style="text-align:center; font-size:12px; margin-top:15px; color:#64748b;">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
                    </div>
                </div>`;
            } else {
                // STUDENT DASHBOARD
                const user = db.users.find(u => u.username === db.currentUser);
                v.innerHTML = `
                <div style="padding:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>Welcome, ${user.username}!</h3>
                        <button onclick="logout()" style="background:none; border:none; color:red; font-size:12px; font-weight:bold;">LOGOUT</button>
                    </div>
                    <p style="color:#64748b; font-size:13px;">Your Enrolled Courses:</p>
                    ${user.courses.length === 0 ? '<p style="font-style:italic;">No courses yet.</p>' : user.courses.map(c => `
                        <div class="course-card">
                            <span><b>${c}</b></span>
                            <span style="color:var(--green); font-size:10px;">PROGRESS: 0%</span>
                        </div>
                    `).join('')}
                    <h3 style="margin-top:30px;">Available Courses</h3>
                    ${courses.filter(c => !user.courses.includes(c)).map(c => `
                        <div class="course-card" style="border-left-color: #cbd5e1;">
                            <span>${c}</span>
                            <button onclick="enroll('${c}')" style="background:var(--orange); color:white; border:none; padding:8px 15px; border-radius:5px; font-size:10px; font-weight:bold;">ENROLL</button>
                        </div>
                    `).join('')}
                </div>`;
            }
        } else if (activeTab === 'market') {
            v.innerHTML = `<div style="padding:20px; text-align:center;"><h2>Marketplace</h2><p>Coming Soon in V51</p></div>`;
        }
        n.innerHTML = `
            <div onclick="window.activeTab='academy'; render();" class="nav-item ${activeTab==='academy'?'nav-active':''}">Academy</div>
            <div onclick="window.activeTab='market'; render();" class="nav-item ${activeTab==='market'?'nav-active':''}">Market</div>
        `;
    }
    window.register = function() {
        const name = document.getElementById('regName').value;
        const pass = document.getElementById('regPass').value;
        if(name && pass) {
            if(db.users.find(u => u.username === name)) return alert("User already exists!");
            db.users.push({ username: name, password: pass, courses: [] });
            db.currentUser = name;
            save(); render();
        } else { alert("Fill all fields"); }
    };
    window.enroll = function(courseName) {
        const user = db.users.find(u => u.username === db.currentUser);
        user.courses.push(courseName);
        save(); render();
        alert("Enrolled in " + courseName);
    };
    window.logout = function() {
        db.currentUser = null;
        save(); render();
    };
    render();
    </script>
</body>
</html>
