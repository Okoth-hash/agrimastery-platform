<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriMastery | Global Marketplace</title>
    <style>
        body { background: #0b1d12; color: #e8f5e9; font-family: 'Segoe UI', sans-serif; padding: 15px; }
        .header { border-bottom: 2px solid #2d6a4f; margin-bottom: 20px; padding-bottom: 10px; }
        .farmer-card { background: #1b4332; border-radius: 12px; padding: 20px; border-left: 6px solid #ffca28; margin-bottom: 20px; }
        .badge { background: #ffca28; color: #000; padding: 3px 10px; border-radius: 5px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .price-box { background: #2d6a4f; padding: 10px; border-radius: 8px; display: inline-block; margin-top: 10px; }
        .btn-action { background: #40916c; color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>AGRIMASTERY</h2>
        <span class="badge">Layer 7 Active: Global Infrastructure</span>
    </div>

    <div class="farmer-card">
        <span class="badge">Verified Master Farmer</span>
        <h2 style="margin: 10px 0;">Omondi's Farm</h2>
        <p>Location: Eldoret, Kenya</p>
        <div class="price-box">
            Maize Stock: 500 Bags | KES 3,200/Bag
        </div>
        <button class="btn-action" onclick="alert('Booking confirmed for Omondi\'s Maize!')">Buy From This Farmer</button>
    </div>

    <div class="farmer-card" style="border-left-color: #2d6a4f; opacity: 0.8;">
        <h3>Standard Listing</h3>
        <p>Maize Stock: 40 Bags | KES 3,100/Bag</p>
        <button class="btn-action" style="background: #2d6a4f;">View Details</button>
    </div>
</body>
</html>
